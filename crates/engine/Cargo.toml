[package]
name = "lividraft-engine"
description = "LiVi Draft engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lividraft-geom = { workspace = true }
lividraft-color = { workspace = true }
lividraft-doc = { workspace = true }
lividraft-dxf = { workspace = true }
lividraft-constraints = { workspace = true }
lividraft-fonts = { workspace = true }
lividraft-render = { workspace = true }
craft-docpath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
lividraft-io = { workspace = true }
